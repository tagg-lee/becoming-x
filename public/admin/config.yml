backend:
  name: github
  repo: tagg-lee/becoming-x
  branch: main
  auth_endpoint: /api/auth
  base_url: https://becomingx.tagg.kr

media_folder: public/assets
public_folder: /assets

collections:
  - name: pages
    label: Contents
    folder: content
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string, required: false }
      - { name: tags, label: Tags, widget: list }
      - { name: uploaded_date, label: Uploaded Date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { name: created_date, label: Created Date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { name: body, label: Body, widget: markdown }
